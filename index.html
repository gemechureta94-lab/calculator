<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        .calculator {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 320px;
        }

        .display {
            width: 100%;
            height: 70px;
            background: #0f172a;
            border: none;
            border-radius: 10px;
            color: #38bdf8;
            font-size: 2rem;
            text-align: right;
            padding: 0 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            background: #334155;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.25rem;
            height: 60px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #475569;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-operator {
            background: #0284c7;
            color: #fff;
        }

        .btn-operator:hover {
            background: #0ea5e9;
        }

        .btn-clear {
            background: #ef4444;
            color: #fff;
        }

        .btn-clear:hover {
            background: #f87171;
        }

        .btn-equal {
            background: #22c55e;
            color: #fff;
            grid-column: span 2;
        }

        .btn-equal:hover {
            background: #4ade80;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="display" id="display" value="0" disabled>
        <div class="buttons">
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button class="btn-operator" onclick="appendValue('/')">&divide;</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="btn-operator" onclick="appendValue('*')">&times;</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="btn-operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="btn-operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendValue(value) {
            if (display.value === '0' && value !== '.') {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = '0';
        }

        function calculate() {
            try {
                let result = eval(display.value.replace(/&times;/g, '*').replace(/&divide;/g, '/'));
                display.value = result;
            } catch (error) {
                display.value = 'Dogoggora (Error)';
            }
        }
    </script>

</body>
</html>
